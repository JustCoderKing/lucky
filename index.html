<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090b10" />
    <meta name="description" content="双色球与大乐透等概率机选，附走势图和近十年开奖号码。手机可直接使用。" />
    <title>双色球 · 大乐透机选</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app" id="app" data-game="ssq">
      <header class="top">
        <p class="eyebrow">等概率机选</p>
        <h1 id="game-title">双色球</h1>
        <div class="seg" role="group" aria-label="玩法">
          <button type="button" data-game="ssq" aria-pressed="true">双色球</button>
          <button type="button" data-game="dlt" aria-pressed="false">大乐透</button>
        </div>
      </header>

      <main>
        <section id="panel-pick" aria-label="选号">
          <article class="latest card" id="latest"></article>
          <label class="avoid">
            <span>
              <strong>避免连号</strong>
              <small id="avoid-hint">红球不出现相邻号码</small>
            </span>
            <input id="avoid" type="checkbox" checked />
          </label>
          <div class="actions">
            <button type="button" id="gen-one">生成 1 注</button>
            <button type="button" id="gen-five" class="ghost">生成 5 注</button>
          </div>
          <div id="stage" class="stage" hidden>
            <canvas id="stage-canvas"></canvas>
            <p id="stage-label" class="stage-label">第 1 注</p>
          </div>
          <div id="tickets" class="tickets" aria-live="polite"></div>
          <p id="odds" class="odds"></p>
          <p id="note" class="note"></p>
        </section>

        <section id="panel-trend" aria-label="走势" hidden>
          <div class="toolbar">
            <div class="seg" id="pool-switch" role="group" aria-label="号码区"></div>
            <div class="seg" role="group" aria-label="期数">
              <button type="button" data-window="30" aria-pressed="true">30 期</button>
              <button type="button" data-window="50" aria-pressed="false">50 期</button>
            </div>
          </div>
          <p class="scroll-hint">左右滑动查看全部号码，最新一期在最上面。</p>
          <div class="trend-scroll" id="trend-scroll" tabindex="0"></div>
          <p class="note">彩色圆点是开出的号码，灰色数字是到这一期为止的遗漏期数。选号不读取这张表。</p>
        </section>

        <section id="panel-history" aria-label="历史开奖" hidden>
          <p id="history-meta" class="note"></p>
          <div id="history-list" class="history"></div>
          <button type="button" id="history-more" class="more">继续加载</button>
        </section>
      </main>

      <nav class="nav" aria-label="栏目">
        <button type="button" data-tab="pick" aria-current="page">选号</button>
        <button type="button" data-tab="trend">走势</button>
        <button type="button" data-tab="history">历史</button>
      </nav>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
